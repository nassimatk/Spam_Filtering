name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
  shell:
    name: Syntaxe des scripts shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in $(git ls-files '*.sh'); do bash -n "$f" && echo "OK $f"; done
