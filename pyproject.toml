[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]   # lignes longues tolérées (docstrings en français)

[tool.ruff.lint.isort]
known-first-party = ["lakehouse", "features", "prepare_data", "producer", "common"]

[tool.pytest.ini_options]
pythonpath = [".", "producer"]
testpaths = ["tests"]
